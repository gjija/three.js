name: GPU contribution Linux validation

on:
  push:
    branches: [ validation/three-gpu-linux ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.name }}
    if: github.repository == 'gjija/three.js' && github.event.created
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            ref: 7c419ddae99fe0f666b509072fcf47e2017542e7
          - name: indirect
            ref: 910d28874b5ee1cdfa99f21e39c9124a327c629c
          - name: fallback
            ref: 7f69efeef22acd474b71184976d1cb7481fbb125
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Verify checkout
        env:
          EXPECTED_SHA: ${{ matrix.ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install Vulkan drivers and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers xvfb
      - name: Install dependencies
        run: npm ci
      - name: Unit and lint tests
        run: npm test
      - name: Example coverage
        run: npm run test-e2e-cov
      - name: Build
        run: npm run build
      - name: Selected official screenshot tests
        run: xvfb-run -a env -u CI VISIBLE=1 npm run test-e2e -- webgpu_compute_geometry webgpu_compute_points webgpu_compute_particles webgpu_compute_water webgpu_compute_rasterizer webgpu_struct_drawindirect
      - name: Upload failed screenshot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gpu-validation-screenshots-${{ matrix.name }}
          path: test/e2e/output-screenshots
          if-no-files-found: ignore
